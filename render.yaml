services:
  - type: web
    name: quantedge-backtest
    env: python
    plan: free
    branch: main
    runtime: python-3.11.9
    buildCommand: pip install --upgrade pip setuptools wheel && pip install --prefer-binary -r requirements.txt
    startCommand: gunicorn app:app
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY